; Mini Energy Hub - ESP32 firmware
; Board: Joy-IT SBC-NodeMCU-ESP32-C (classic ESP32-WROOM-32, USB-C),
; Conrad article 3344407. Any classic ESP32 DevKit works with esp32dev.
;
; Everything here is pinned on purpose. Three kits, six students and two
; or three laptops must all produce the same binary, and a week is too
; short to debug someone's toolchain.
;
; espressif32 @ 8.0.0 is the FIRST official PlatformIO platform release
; that ships Arduino-ESP32 core 3.x (3.3.12, released 2026-10-19).
; Platform 7.1.3 and older still ship core 2.0.17, which does NOT have
; ledcAttach() - the firmware will not compile there.
;
;   pio run             compile
;   pio run -t upload   flash the ESP32 (needs a USB DATA cable)
;   pio device monitor  serial output at 115200 baud

[env:esp32dev]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino

monitor_speed = 115200
build_flags = -Wall

lib_deps =
    adafruit/Adafruit SSD1306@2.5.17
    adafruit/Adafruit GFX Library@1.13.0
    adafruit/Adafruit BusIO@1.17.4
